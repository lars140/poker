name = "felt-poker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The exported website (npm run build writes ./out). Everything except /api/* is served from here.
[assets]
directory = "../out"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
# Only needed for local development, where the website (localhost:3000) calls the Worker (localhost:8787).
# In production the site and the API share one address, so no cross-origin access is allowed or needed.
ALLOWED_ORIGINS = "http://localhost:3000"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
